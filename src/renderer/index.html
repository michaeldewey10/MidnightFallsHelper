<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
    <title>Midnight Falls Helper</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="overlay-shell">
      <header class="top-bar">
        <div class="drag-zone">
          <p class="eyebrow">Death's Dirge</p>
          <h1>Midnight Falls Helper</h1>
        </div>
        <div class="window-actions">
          <button id="minimizeButton" class="window-button" type="button" aria-label="Minimize" title="Minimize">&minus;</button>
          <button id="maximizeButton" class="window-button" type="button" aria-label="Maximize" title="Maximize"><span class="window-square" aria-hidden="true"></span></button>
          <button id="quitButton" class="window-button close-button" type="button" aria-label="Exit" title="Exit">&#10005;</button>
        </div>
      </header>

      <section class="arena-panel" aria-label="Death's Dirge order">
        <div class="arena" id="arena">
          <div class="tank-marker">
            <img src="./assets/tank.png" alt="Tank">
          </div>
          <div class="boss-core" aria-hidden="true"></div>
          <div id="arenaSlots" class="arena-slots"></div>
        </div>
      </section>

      <div id="detailsPanel" class="details-panel">
        <section class="sequence-strip" aria-live="polite">
          <span id="sequenceCount">0 / 5</span>
          <div id="sequencePills" class="sequence-pills"></div>
        </section>

        <section class="controls" aria-label="Leader input controls">
          <div id="symbolButtons" class="symbol-grid"></div>
          <button id="resetButton" class="symbol-button danger-button reset-button" type="button">Reset</button>
        </section>

        <section class="sync-panel" aria-label="Sync controls">
          <p id="errorText" class="error-text"></p>
          <div class="sync-actions">
            <button id="createRoomButton" class="primary-button" type="button">Create Room</button>
            <button id="disconnectButton" class="secondary-button" type="button">Disconnect</button>
            <input id="roomCodeInput" type="text" autocomplete="off" spellcheck="false" maxlength="8" placeholder="ABCD">
            <button id="joinRoomButton" class="primary-button" type="button">Join Room</button>
          </div>
          <p id="roomText" class="host-url"></p>
        </section>
      </div>

      <div id="hotkeysPanel" class="hotkeys-panel" hidden>
        <footer class="hotkey-help">
          <span>Runes: Ctrl/Cmd + Shift + 1-5</span>
          <span>Reset: Ctrl/Cmd + Shift + R</span>
          <span>Click-through: Ctrl/Cmd + Shift + Space</span>
        </footer>
      </div>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
